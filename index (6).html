<!DOCTYPE html>
<html lang="fr" data-theme="light" data-accent="yellow">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethan Roussel — Portfolio esport</title>
<meta name="description" content="Portfolio d'Ethan Roussel (Loukas), rédacteur esport : interviews, actualités et comptes-rendus de compétitions pour Parlons Esport et Matepedia.">
<meta property="og:title" content="Ethan Roussel — Portfolio esport">
<meta property="og:description" content="Interviews, actualités et compétitions esport. Rédacteur chez Parlons Esport.">
<meta property="og:image" content="assets/photo-profil.jpg">
<link rel="icon" href="assets/photo-profil.jpg">
<script>
  try{ var t = localStorage.getItem('pf-theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#f3f7f7; --surface:#ffffff; --surface-2:#e8f0f1;
    --ink:#0b2a30; --muted:#587278; --line:rgba(11,42,48,.12);
    --teal:#0a7f8c; --teal-ink:#ffffff; --teal-soft:#d4ecee;
    --yellow:#ffc93c; --pink:#ff6fa5;
    --accent:var(--yellow); --accent-ink:#2a1f00;
    --shadow:0 18px 40px -24px rgba(8,50,58,.45);
    --radius:22px;
  }
  :root[data-accent="pink"]{ --accent:var(--pink); --accent-ink:#3a0019; }
  :root[data-theme="dark"]{
    --bg:#071a1d; --surface:#0e2a2f; --surface-2:#133a41;
    --ink:#e8f5f5; --muted:#8fb0b5; --line:rgba(232,245,245,.14);
    --teal:#2cc0cf; --teal-ink:#032126; --teal-soft:#0f3a40;
    --shadow:0 18px 40px -24px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:'Bricolage Grotesque','Inter',sans-serif;margin:0;letter-spacing:-.02em;}
  button{font-family:inherit;cursor:pointer;}
  img,video{max-width:100%;display:block;}
  :focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 clamp(20px,5vw,40px);}

  /* ---------- TOPBAR ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:14px;}
  .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--teal);}
  nav.main{display:flex;align-items:center;gap:6px;}
  nav.main a{font-size:14.5px;font-weight:500;color:var(--muted);padding:8px 13px;border-radius:99px;transition:background .15s,color .15s;}
  nav.main a:hover{color:var(--ink);background:var(--surface-2);}
  nav.main a.current{background:var(--teal);color:var(--teal-ink);}
  .theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;margin-left:4px;}
  .theme-btn:hover{background:var(--surface-2);}
  .theme-btn svg{width:18px;height:18px;}

  main{padding:clamp(28px,5vw,56px) 0 90px;min-height:70vh;}
  .view{animation:in .45s ease both;}
  @keyframes in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.view{animation:none;} html{scroll-behavior:auto;}}

  /* ---------- HERO ---------- */
  .hero{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(24px,5vw,56px);align-items:center;}
  .hero h1{font-size:clamp(44px,9vw,92px);font-weight:800;line-height:.98;}
  .hero h1 span{color:var(--teal);}
  .hero .tagline{font-size:clamp(17px,2.2vw,21px);color:var(--muted);max-width:30ch;margin-top:22px;}
  .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:99px;padding:13px 22px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .15s;}
  .btn:hover{transform:translateY(-2px);}
  .btn.primary{background:var(--teal);color:var(--teal-ink);}
  .btn.accent{background:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn.sm{padding:7px 13px;font-size:12.5px;}
  .photo-wrap{position:relative;justify-self:center;width:min(100%,360px);}
  .photo-wrap::before{content:"";position:absolute;inset:6% -6% -6% 8%;background:var(--accent);border-radius:34px;transform:rotate(5deg);}
  .photo-wrap::after{content:"";position:absolute;inset:-5% 10% 10% -7%;background:var(--teal);border-radius:34px;transform:rotate(-4deg);opacity:.9;}
  .photo-wrap .frame{position:relative;z-index:2;border-radius:30px;overflow:hidden;aspect-ratio:4/5;background:var(--surface-2);box-shadow:var(--shadow);}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;will-change:transform;}
  .photo-wrap .initials{height:100%;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-size:84px;font-weight:800;color:var(--teal);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:clamp(40px,7vw,72px);}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;}
  .stat b{display:block;font-family:'Bricolage Grotesque';font-size:clamp(34px,5vw,50px);font-weight:800;line-height:1;color:var(--teal);}
  .stat span{display:block;margin-top:8px;color:var(--muted);font-size:14px;}

  h2.section{font-size:clamp(28px,4.5vw,40px);font-weight:800;margin:clamp(48px,8vw,84px) 0 22px;}

  /* ---------- OUTLETS ---------- */
  .outlets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
  .outlet-card{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:transform .2s,box-shadow .2s,border-color .2s;}
  .outlet-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--teal);}
  .outlet-card .logo{width:72px;height:72px;border-radius:18px;object-fit:cover;flex-shrink:0;background:var(--surface-2);}
  .outlet-card .logo.ph{display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;color:var(--teal);}
  .outlet-card h3{font-size:22px;font-weight:800;}
  .outlet-card p{margin:4px 0 0;color:var(--muted);font-size:14px;}

  /* ---------- ARTICLES ---------- */
  .list{display:flex;flex-direction:column;gap:12px;}
  .art{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px 16px 16px;transition:transform .18s,border-color .18s,box-shadow .18s;}
  .art:hover{transform:translateX(5px);border-color:var(--c,var(--teal));box-shadow:var(--shadow);}
  .art .thumb{width:108px;height:76px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--surface-2);}
  .art .bar{width:6px;align-self:stretch;border-radius:4px;background:var(--c,var(--teal));flex-shrink:0;}
  .art .body{min-width:0;flex:1;}
  .art h3{font-size:clamp(16px,2.1vw,19px);font-weight:700;line-height:1.3;}
  .art .meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted);}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--c,var(--teal));color:var(--c-ink,#fff);font-weight:600;font-size:12px;}
  .art .go{flex-shrink:0;font-size:13.5px;font-weight:600;color:var(--muted);}
  .art:hover .go{color:var(--ink);}

  .crumb{font-size:14px;color:var(--muted);margin-bottom:22px;display:flex;gap:8px;flex-wrap:wrap;}
  .crumb a:hover{color:var(--teal);text-decoration:underline;}

  .page-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .page-head img.logo{width:68px;height:68px;border-radius:18px;object-fit:cover;}
  .page-head h1{font-size:clamp(34px,6.5vw,60px);font-weight:800;line-height:1;}
  .lead{color:var(--muted);max-width:60ch;font-size:17px;margin-top:16px;}
  .cover{margin-top:26px;border-radius:var(--radius);overflow:hidden;max-height:340px;}
  .cover img{width:100%;height:100%;object-fit:cover;}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px;}
  .tile{border-radius:var(--radius);padding:26px;background:var(--c);color:var(--c-ink);transition:transform .2s;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;}
  .tile:hover{transform:translateY(-5px) rotate(-.6deg);}
  .tile b{font-family:'Bricolage Grotesque';font-size:56px;font-weight:800;line-height:1;}
  .tile span{font-size:19px;font-weight:700;font-family:'Bricolage Grotesque';}
  .tile small{display:block;margin-top:4px;opacity:.8;font-size:13.5px;}

  .empty{margin-top:34px;padding:34px;border:2px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center;}

  /* toolbar */
  .toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:26px 0 20px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:99px;font-size:14px;font-weight:500;transition:background .15s,color .15s,border-color .15s;}
  .chip:hover{border-color:var(--teal);}
  .chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
  .sort{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
  .sort select{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:12px;font:inherit;}
  .count-line{color:var(--muted);font-size:14px;margin-bottom:14px;}

  /* reader */
  .reader h1{font-size:clamp(30px,5.5vw,52px);font-weight:800;line-height:1.05;max-width:22ch;margin-top:14px;}
  .reader .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px;}
  .reader .body{max-width:66ch;font-size:17px;margin-top:30px;}
  .reader .body p{margin:0 0 18px;}
  .reader .hero-img,.reader video{width:100%;border-radius:var(--radius);margin-top:26px;max-height:460px;object-fit:cover;}


  /* ---------- CRÉDITS PHOTO ---------- */
  figure.fig{margin:0;}
  figcaption.credit,.credit-line,p.credit{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.4;}
  .credit-line{margin:6px 0 0;}
  .chip-credit{position:absolute;left:14px;bottom:14px;background:rgba(5,20,24,.8);color:#fff;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:99px;max-width:calc(100% - 28px);}
  .photo-wrap p.credit{position:relative;z-index:2;text-align:center;margin-top:16px;}
  .reader figure.fig{margin:26px 0 0;}
  .reader figure .hero-img{margin-top:0;}

  /* ---------- À LA UNE ---------- */
  .feature{display:grid;grid-template-columns:1.2fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:30px;overflow:hidden;margin-top:clamp(40px,7vw,72px);box-shadow:var(--shadow);transition:transform .2s;}
  .feature:hover{transform:translateY(-4px);}
  .f-media{position:relative;min-height:340px;background:var(--teal);}
  .f-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .f-ph{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-size:44px;font-weight:800;color:var(--teal-ink);opacity:.9;}
  .f-body{padding:clamp(24px,4vw,46px);display:flex;flex-direction:column;justify-content:center;gap:14px;align-items:flex-start;}
  .kicker{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;}
  .f-body h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;line-height:1.08;}
  .f-body .meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13px;color:var(--muted);}

  /* ---------- NATURE DU TRAVAIL ---------- */
  .badge-iv{display:inline-block;background:color-mix(in srgb,var(--surface) 62%,transparent);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:600;font-size:12px;padding:3px 10px;border-radius:99px;}
  .mode-note{font-style:italic;font-size:12.5px;color:var(--muted);}
  .legend{margin:14px 0 0;padding:14px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14.5px;max-width:70ch;}
  .legend b{color:var(--ink);}

  /* ---------- FAVORIS ---------- */
  .favs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;}
  .fav{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s;}
  .fav:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .fav .fimg{aspect-ratio:16/9;object-fit:cover;width:100%;background:var(--surface-2);}
  .fav .fb{padding:18px 20px 20px;}
  .fav .meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted);}
  .fav h3{font-size:19px;font-weight:700;line-height:1.3;}
  .why{margin:12px 0 0;padding-left:12px;border-left:3px solid var(--accent);font-style:italic;font-size:14.5px;}
  .star{color:var(--accent-ink);background:var(--accent);border-radius:99px;font-size:11.5px;font-weight:700;padding:2px 8px;}

  /* ---------- RECHERCHE ---------- */
  .searchbar{position:relative;margin-top:26px;}
  .searchbar svg{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);}
  .searchbar input{width:100%;padding:17px 22px 17px 52px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;}
  .searchbar input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);}
  .chips.second{margin-top:10px;}

  /* ---------- ÉDITEUR (ajouts) ---------- */
  .f label.chk,label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer;margin:0;}
  label.chk small{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
  label.chk input{margin-top:3px;flex-shrink:0;}

  /* ---------- J'AIME ---------- */
  .like{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:13.5px;font-weight:600;flex-shrink:0;transition:transform .15s,background .15s;}
  .like:hover{transform:scale(1.07);}
  .like svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
  .like[aria-pressed="true"]{color:#e0457b;border-color:#e0457b;}
  .like[aria-pressed="true"] svg{fill:currentColor;}
  .like.float{position:absolute;top:14px;right:14px;z-index:3;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .artw{display:flex;gap:10px;align-items:center;}
  .artw>.art{flex:1;min-width:0;}
  .lkw{position:relative;}
  .favs>.lkw{display:flex;}
  .favs>.lkw>.fav{flex:1;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:200;}

  /* ---------- ÉDITEUR : articles repliables ---------- */
  details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;}
  details.card>summary::-webkit-details-marker{display:none;}
  details.card>summary::after{content:"▾";color:var(--muted);}
  details.card[open]>summary::after{content:"▴";}
  details.card[open]>summary{margin-bottom:14px;}
  details.card>summary small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px;}
  @keyframes flash{from{box-shadow:0 0 0 4px var(--accent);}to{box-shadow:0 0 0 0 transparent;}}
  details.card.flash{animation:flash 1.6s ease-out;}
  .lkrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .lkrow b{white-space:nowrap;}

  /* ---------- ABOUT ---------- */
  .about-head h1{font-size:clamp(38px,7vw,72px);font-weight:800;line-height:1;}
  .timeline{position:relative;margin-top:50px;padding-left:46px;}
  .timeline::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px;}
  .tl-progress{position:absolute;left:13px;top:6px;width:3px;height:0;background:var(--teal);border-radius:3px;}
  .step{position:relative;padding:8px 0 64px;opacity:.35;transform:translateY(24px);transition:opacity .6s,transform .6s;}
  .step.in{opacity:1;transform:none;}
  .step::before{content:"";position:absolute;left:-42px;top:14px;width:19px;height:19px;border-radius:50%;background:var(--bg);border:3px solid var(--line);transition:background .4s,border-color .4s,transform .4s;}
  .step.in::before{background:var(--accent);border-color:var(--teal);transform:scale(1.1);}
  .step.has-img{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;}
  .step h2{font-size:clamp(26px,4vw,38px);font-weight:800;}
  .step p{color:var(--muted);font-size:17px;margin:12px 0 0;max-width:56ch;}
  .step img{width:100%;border-radius:var(--radius);aspect-ratio:4/3;object-fit:cover;box-shadow:var(--shadow);}
  @media (prefers-reduced-motion:reduce){.step{opacity:1;transform:none;transition:none;}}

  /* ---------- CONTACT ---------- */
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,56px);align-items:center;}
  .contact.no-img{grid-template-columns:1fr;}
  .contact h1{font-size:clamp(40px,8vw,80px);font-weight:800;line-height:1;}
  .contact .pic{border-radius:30px;overflow:hidden;aspect-ratio:4/5;box-shadow:var(--shadow);}
  .contact .pic img{width:100%;height:100%;object-fit:cover;}
  .links{display:flex;flex-direction:column;gap:10px;margin-top:28px;}
  .link{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:17px;transition:background .18s,color .18s,transform .18s;}
  .link:hover{background:var(--teal);color:var(--teal-ink);transform:translateX(6px);}

  /* ---------- FOOTER ---------- */
  footer{background:var(--surface);border-top:1px solid var(--line);padding:48px 0 26px;}
  .foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px;}
  .foot h3{font-size:22px;font-weight:800;}
  .foot p{color:var(--muted);font-size:14.5px;margin:10px 0 0;max-width:36ch;}
  .foot h4{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;}
  .foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .foot a{font-size:15px;}
  .foot a:hover{color:var(--teal);text-decoration:underline;}
  .foot-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
  .foot-bottom button{background:none;border:none;color:var(--muted);font-size:13px;padding:0;text-decoration:underline;}
  .foot-bottom button:hover{color:var(--ink);}

  /* ---------- EDIT ---------- */
  .ov{position:fixed;inset:0;background:rgba(3,15,18,.65);z-index:100;display:flex;justify-content:flex-end;}
  .panel{width:min(560px,100%);height:100%;background:var(--bg);color:var(--ink);overflow-y:auto;padding:24px 24px 90px;border-left:1px solid var(--line);position:relative;}
  .panel h2{font-size:24px;font-weight:800;}
  .panel .x{position:absolute;top:18px;right:20px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px;}
  .tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:500;}
  .tabs button.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);}
  .f{margin-bottom:14px;}
  .f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .f input[type=text],.f input[type=email],.f input[type=url],.f input[type=date],.f textarea,.f select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;font-size:14px;}
  .f textarea{resize:vertical;min-height:80px;}
  .f input[type=file]{font-size:12.5px;color:var(--muted);max-width:100%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:var(--surface);}
  .card.inner{background:var(--bg);}
  .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
  .card-h strong{font-size:14px;}
  .b{border:none;border-radius:99px;padding:9px 16px;font-size:13.5px;font-weight:600;background:var(--teal);color:var(--teal-ink);}
  .b.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .b.del{background:transparent;border:1.5px solid #d6455b;color:#d6455b;}
  .b.s{padding:5px 11px;font-size:12px;}
  .imgf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .imgf .pv{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2);}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px;}
  .savebar{position:sticky;bottom:-90px;background:var(--bg);padding:14px 0;margin-top:18px;display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);}
  .status{font-size:13px;color:var(--muted);}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;}
    .photo-wrap{order:-1;width:min(70%,290px);justify-self:start;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .contact{grid-template-columns:1fr;}
    .foot{grid-template-columns:1fr;}
    .step.has-img{grid-template-columns:1fr;}
    .art .go{display:none;}
    .feature{grid-template-columns:1fr;}
    .f-media{min-height:240px;}
    .art .thumb{width:84px;height:64px;}
    nav.main a{padding:7px 10px;font-size:13.5px;}
    .brand span.t{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="#/" class="brand"><img class="mark" id="brandImg" alt="" hidden><span class="t" id="brandName">Portfolio</span></a>
    <nav class="main" aria-label="Navigation principale">
      <a href="#/" data-route="home">Accueil</a>
      <a href="#/articles" data-route="articles">Articles</a>
      <a href="#/about" data-route="about">À propos</a>
      <a href="#/contact" data-route="contact">Contact</a>
      <button class="theme-btn" id="themeBtn" aria-label="Changer de thème clair ou sombre" title="Thème clair / sombre"></button>
    </nav>
  </div>
</header>

<main><div class="wrap" id="app"><p style="color:var(--muted)">Chargement…</p></div></main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div>
        <h3 id="fName">Portfolio</h3>
        <p id="fTag"></p>
      </div>
      <div>
        <h4>Navigation</h4>
        <ul id="fNav"></ul>
      </div>
      <div>
        <h4>Me retrouver</h4>
        <ul id="fLinks"></ul>
      </div>
    </div>
    <div class="foot-bottom">
      <span id="fCopy"></span>
      <span>Les articles restent la propriété de leurs médias respectifs. Crédit photo indiqué sous chaque image · <a href="#/credits" style="text-decoration:underline">tous les crédits</a></span>
      <button id="editTrigger">Gérer le contenu</button>
    </div>
  </div>
</footer>

<div id="editRoot"></div>

<script>
/* Ce fichier ne contient aucun contenu : tout vit dans data.json.
   Utilise « Gérer le contenu » en bas de page pour tout modifier. */

const FALLBACK = {
  editPassword:"louston2026",
  github:{owner:"",repo:"",branch:"main",path:"data.json"},
  author:{name:"Ethan Roussel",aliases:"",bio:"",tagline:"",photo:""},
  theme:{accent:"yellow"}, contact:{email:"",instagram:"",x:"",linkedin:"",intro:"",image:""},
  aboutIntro:"", about:[], outlets:[]
};

let DATA = null;
let unlocked = false;
let tab = "profil";
let ghToken = null;
let saving = false;
const pending = {};            // { "assets/uploads/x.jpg": { b64, preview } } en attente d'envoi sur GitHub
let openSet = new WeakSet(), newTarget = null;
let fGame = "Tous", fSort = "desc", fKey = "";

/* ---------- utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uid = () => Math.random().toString(36).slice(2,8);
const imgSrc = p => (p && pending[p]) ? pending[p].preview : (p || "");
const COLORS = { teal:{c:"var(--teal)",ink:"var(--teal-ink)"}, sun:{c:"var(--accent)",ink:"var(--accent-ink)"}, rose:{c:"var(--pink)",ink:"#3a0019"} };
const col = k => COLORS[k] || COLORS.teal;
function nd(d){ const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(d||"").trim()); return m ? m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0") : ""; }
const byDate = dir => (p,q)=>{ const d=nd(p.a.date), e=nd(q.a.date); if(!d&&!e) return 0; if(!d) return 1; if(!e) return -1; return dir==="desc" ? e.localeCompare(d) : d.localeCompare(e); };
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'").toLowerCase();
function getPath(o,p){ return p.split(".").reduce((c,k)=>c==null?"":c[k],o) || ""; }
const isInt = a => a.type==="texte"||a.type==="videofile";
const modeBadge = a => a.mode==="interview" ? `<span class="badge-iv">Interview de A à Z</span>` : "";
const credLine = c => c ? `Crédit photo : ${esc(c)}` : "";
function fig(src, credit, alt, cls){ return `<figure class="fig ${cls||""}"><img src="${esc(imgSrc(src))}" alt="${esc(alt||"")}" loading="lazy">${credit?`<figcaption class="credit">${credLine(credit)}</figcaption>`:""}</figure>`; }
function fmtDate(d){ d = nd(d); if(!d) return ""; const x = new Date(d+"T12:00:00"); return isNaN(x) ? "" : x.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}); }
function allArticles(){ const r=[]; DATA.outlets.forEach(o=>o.categories.forEach(c=>c.articles.forEach((a,i)=>r.push({o,c,a,i})))); return r; }
function allGames(){ return [...new Set(allArticles().filter(x=>x.o.filterable!==false).map(x=>x.a.game).filter(Boolean))]; }
function htmlToText(h){ return (h||"").replace(/<\/p>/gi,"\n\n").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\n{3,}/g,"\n\n").trim(); }
function textToHtml(t){ return t.split(/\n{2,}|\n/).map(l=>l.trim()).filter(Boolean).map(l=>"<p>"+esc(l)+"</p>").join(""); }
function setPath(o,p,v){ const k=p.split("."); let c=o; for(let i=0;i<k.length-1;i++) c=c[k[i]]; c[k[k.length-1]]=v; }

/* ---------- J'aime (compteur public gratuit : Abacus) ---------- */
const LK_BASE = "https://abacus.jasoncameron.dev";
const lsGet = (k)=>{ try{ return JSON.parse(localStorage.getItem(k)||"{}"); }catch(e){ return {}; } };
const lsSet = (k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const lkCache = lsGet("pf-likes"), lkMine = lsGet("pf-liked");
let lkQ=[], lkBusy=false;
const HEART = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.7 4.5 6.3 4.5c2.1 0 3.7 1.1 4.7 2.7h2c1-1.6 2.6-2.7 4.7-2.7 3.6 0 5.4 3.8 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>';
function akey(a){ const b=(a.url||a.title||"x"); let h=5381; for(let i=0;i<b.length;i++) h=((h<<5)+h+b.charCodeAt(i))|0; return "a"+(h>>>0).toString(36); }
function likeOn(){ return DATA.likes && DATA.likes.enabled!==false; }
function likeBtn(a,cls){ if(!likeOn()) return ""; const k=akey(a); return `<button type="button" class="like ${cls||""}" data-lk="${k}" aria-pressed="${!!lkMine[k]}" aria-label="J'aime cet article (cliquer à nouveau pour retirer)" title="J'aime (re-clique pour retirer)">${HEART}<span class="n"></span></button>`; }
function lkUrl(kind,k){ return `${LK_BASE}/${kind}/${encodeURIComponent(DATA.likes.namespace)}/${k}`; }
function lkPaint(k){
  document.querySelectorAll('.like[data-lk="'+k+'"]').forEach(b=>{
    b.setAttribute("aria-pressed", !!lkMine[k]);
    const c=lkCache[k]; b.querySelector(".n").textContent = (c && c.n>0) ? c.n : "";
  });
}
function lkPump(){ if(lkBusy) return; lkBusy=true; (async()=>{ while(lkQ.length){ await lkQ.shift()(); await new Promise(r=>setTimeout(r,800)); } lkBusy=false; })(); }
function lkLoad(k,force){
  const c=lkCache[k]; if(!force && c && Date.now()-c.t<15*60000) return Promise.resolve(c.n);
  return new Promise(res=>{ lkQ.push(async()=>{ try{ const one=async kk=>{ const r=await fetch(lkUrl("get",kk)); if(r.status===404) return 0; if(!r.ok) throw 0; return +(await r.json()).value||0; }; const n=Math.max(0,(await one(k))-(await one("u"+k))); lkCache[k]={n,t:Date.now()}; lsSet("pf-likes",lkCache); lkPaint(k); res(n); }catch(e){ res(null); } }); lkPump(); });
}
function hydrateLikes(){
  if(!likeOn()) return;
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); lkLoad(e.target.dataset.lk); } }),{rootMargin:"200px"}) : null;
  document.querySelectorAll(".like").forEach(b=>{ lkPaint(b.dataset.lk); if(io) io.observe(b); else lkLoad(b.dataset.lk); });
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
document.addEventListener("click",async e=>{
  const b=e.target.closest(".like"); if(!b) return; e.preventDefault(); e.stopPropagation();
  const k=b.dataset.lk, was=!!lkMine[k], prev=lkCache[k]?lkCache[k].n:0;
  /* aimer = +1 sur le compteur « k » ; retirer = +1 sur le compteur « u+k » (le service ne sait pas décrémenter) */
  if(was) delete lkMine[k]; else lkMine[k]=1;
  lkCache[k]={n:Math.max(0,prev+(was?-1:1)),t:Date.now()}; lsSet("pf-liked",lkMine); lkPaint(k);
  try{ const r=await fetch(lkUrl("hit",(was?"u":"")+k)); if(!r.ok) throw 0; lkCache[k].t=0; lsSet("pf-likes",lkCache); }
  catch(err){ if(was) lkMine[k]=1; else delete lkMine[k]; lkCache[k]={n:prev,t:Date.now()}; lsSet("pf-liked",lkMine); toast("Action non envoyée, réessaie plus tard."); }
  lkPaint(k);
},true);

/* ---------- chargement ---------- */
async function load(){
  try{ const r = await fetch("./data.json",{cache:"no-store"}); DATA = r.ok ? await r.json() : structuredClone(FALLBACK); }
  catch(e){ DATA = structuredClone(FALLBACK); }
  const g0=DATA.github||{}; DATA.likes=Object.assign({enabled:true,namespace:((g0.owner&&g0.repo)?g0.owner+"-"+g0.repo:"portfolio-likes")},DATA.likes||{});
  applyTheme(); chrome(); route();
}
function applyTheme(){ document.documentElement.setAttribute("data-accent", (DATA.theme && DATA.theme.accent) || "yellow"); }

/* ---------- thème clair / sombre ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeIcon(){ document.getElementById("themeBtn").innerHTML = document.documentElement.getAttribute("data-theme")==="dark" ? SUN : MOON; }
document.getElementById("themeBtn").addEventListener("click",()=>{
  const n = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n);
  try{ localStorage.setItem("pf-theme", n); }catch(e){}
  themeIcon();
});
themeIcon();

/* ---------- barre / pied de page ---------- */
function socials(){
  const c = DATA.contact, r=[];
  if(c.email) r.push(["Écrire un email","mailto:"+c.email]);
  if(c.instagram) r.push(["Instagram",c.instagram]);
  if(c.x) r.push(["X (Twitter)",c.x]);
  if(c.linkedin) r.push(["LinkedIn",c.linkedin]);
  return r;
}
function chrome(){
  const a = DATA.author;
  document.getElementById("brandName").textContent = a.name;
  const bi = document.getElementById("brandImg");
  if(a.photo){ bi.src = imgSrc(a.photo); bi.hidden = false; } else bi.hidden = true;
  document.getElementById("fName").textContent = a.name;
  document.getElementById("fTag").textContent = a.tagline || "";
  document.getElementById("fNav").innerHTML = `<li><a href="#/">Accueil</a></li><li><a href="#/articles">Articles</a></li><li><a href="#/about">À propos</a></li><li><a href="#/contact">Contact</a></li>` +
    DATA.outlets.map(o=>`<li><a href="#/outlet/${esc(o.id)}">${esc(o.name)}</a></li>`).join("");
  const s = socials();
  document.getElementById("fLinks").innerHTML = s.length ? s.map(l=>`<li><a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a></li>`).join("") : `<li><a href="#/contact">Me contacter</a></li>`;
  document.getElementById("fCopy").textContent = "© " + new Date().getFullYear() + " " + a.name;
  let cur = (location.hash.replace(/^#\/?/,"").split("/")[0]) || "home"; if(cur==="outlet") cur="articles";
  document.querySelectorAll("nav.main a").forEach(x=>x.classList.toggle("current", x.dataset.route===cur));
}

/* ---------- pages ---------- */
function artCard(o,c,a,i,showOutlet){
  const k = col(c.color);
  const href = isInt(a) ? `#/outlet/${esc(o.id)}/${esc(c.id)}/${i}` : esc(a.url||"#");
  const ext = !isInt(a);
  const lbl = a.type==="texte" ? "Lire ici" : (a.type==="videofile"||a.type==="video") ? "Voir la vidéo" : "Lire l'article ↗";
  return `<div class="artw"><a class="art" style="--c:${k.c};--c-ink:${k.ink}" href="${href}" ${ext?'target="_blank" rel="noopener"':''}>
    ${a.image ? `<img class="thumb" src="${esc(imgSrc(a.image))}" alt="" loading="lazy">` : `<span class="bar"></span>`}
    <div class="body">
      <div class="meta">${a.fav?`<span class="star">★ Favori</span>`:""}${modeBadge(a)}${a.game?`<span class="pill">${esc(a.game)}</span>`:""}${a.event?`<span>${esc(a.event)}</span>`:""}${nd(a.date)?`<span>${fmtDate(a.date)}</span>`:""}${showOutlet?`<span>${esc(o.name)}</span>`:""}</div>
      <h3>${esc(a.title)}</h3>
      ${a.image && a.imageCredit ? `<div class="credit-line">${credLine(a.imageCredit)}</div>`:""}
    </div>
    <span class="go">${lbl}</span>
  </a>${likeBtn(a)}</div>`;
}

function featured(x){
  const {o,c,a,i} = x, ext = !isInt(a);
  const href = isInt(a) ? `#/outlet/${esc(o.id)}/${esc(c.id)}/${i}` : esc(a.url||"#");
  return `<div class="lkw"><a class="feature" href="${href}" ${ext?'target="_blank" rel="noopener"':''}>
    <div class="f-media">${a.image ? `<img src="${esc(imgSrc(a.image))}" alt="">` : `<div class="f-ph">${esc(o.name)}</div>`}${a.image && a.imageCredit ? `<span class="chip-credit">${credLine(a.imageCredit)}</span>`:""}</div>
    <div class="f-body">
      <span class="kicker">À la une · dernière publication</span>
      <div class="meta">${modeBadge(a)}${a.game?`<span class="pill" style="--c:${col(c.color).c};--c-ink:${col(c.color).ink}">${esc(a.game)}</span>`:""}${a.event?`<span>${esc(a.event)}</span>`:""}<span>${fmtDate(a.date)}</span><span>${esc(o.name)}</span></div>
      <h2>${esc(a.title)}</h2>
      <span class="btn accent">${a.type==="texte"?"Lire l'article":"Lire l'article ↗"}</span>
    </div></a>${likeBtn(a,"float")}</div>`;
}

function favCard(x){
  const {o,c,a,i} = x, ext = !isInt(a);
  const href = isInt(a) ? `#/outlet/${esc(o.id)}/${esc(c.id)}/${i}` : esc(a.url||"#");
  return `<div class="lkw"><a class="fav" href="${href}" ${ext?'target="_blank" rel="noopener"':''}>
    ${a.image ? `<img class="fimg" src="${esc(imgSrc(a.image))}" alt="" loading="lazy">` : ""}
    <div class="fb">
      <div class="meta">${modeBadge(a)}${a.game?`<span class="pill">${esc(a.game)}</span>`:""}<span>${esc(o.name)}</span>${nd(a.date)?`<span>${fmtDate(a.date)}</span>`:""}</div>
      <h3>${esc(a.title)}</h3>
      ${a.favNote ? `<p class="why">${esc(a.favNote)}</p>` : ""}
      ${a.image && a.imageCredit ? `<div class="credit-line">${credLine(a.imageCredit)}</div>`:""}
    </div></a>${likeBtn(a,"float")}</div>`;
}

function outletCards(){
  return `<div class="outlets">${DATA.outlets.map(o=>{
    const n = o.categories.reduce((s,c)=>s+c.articles.length,0);
    return `<a class="outlet-card" href="#/outlet/${esc(o.id)}">
      ${o.logo ? `<img class="logo" src="${esc(imgSrc(o.logo))}" alt="Logo ${esc(o.name)}">` : `<span class="logo ph">${esc(o.name[0]||"?")}</span>`}
      <div><h3>${esc(o.name)}</h3><p>${esc(o.role)} · ${n} publication${n>1?"s":""}</p></div></a>`;}).join("")}</div>`;
}

function home(){
  const a = DATA.author, arts = allArticles();
  const games = allGames().length, ivs = arts.filter(x=>x.a.mode==="interview").length;
  const dated = arts.filter(x=>nd(x.a.date)).sort(byDate("desc"));
  const top = dated[0], latest = dated.slice(1,5);
  const favs = arts.filter(x=>x.a.fav).sort(byDate("desc"));
  const ini = a.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const first = a.name.split(" ")[0], rest = a.name.split(" ").slice(1).join(" ");
  return `<div class="view">
    <section class="hero">
      <div>
        <h1>${esc(first)} <span>${esc(rest)}</span></h1>
        <p class="tagline">${esc(a.tagline||a.bio)}</p>
        ${a.aliases ? `<p style="color:var(--muted);margin:8px 0 0;font-size:14.5px">${esc(a.aliases)}</p>`:""}
        <div class="cta">
          <a class="btn primary" href="#/articles">Voir mes articles</a>
          <a class="btn accent" href="#/contact">Me contacter</a>
        </div>
      </div>
      <div class="photo-wrap"><div class="frame">${a.photo ? `<img id="heroImg" src="${esc(imgSrc(a.photo))}" alt="Portrait de ${esc(a.name)}">` : `<div class="initials">${esc(ini)}</div>`}</div>${a.photoCredit?`<p class="credit">${credLine(a.photoCredit)}</p>`:""}</div>
    </section>
    ${top ? featured(top) : ""}
    <section class="stats" id="stats">
      <div class="stat"><b data-n="${arts.length}">0</b><span>articles publiés</span></div>
      <div class="stat"><b data-n="${ivs}">0</b><span>interviews menées de A à Z</span></div>
      <div class="stat"><b data-n="${DATA.outlets.length}">0</b><span>médias</span></div>
      <div class="stat"><b data-n="${games}">0</b><span>jeux couverts</span></div>
    </section>
    ${favs.length ? `<h2 class="section">Mes articles dont je suis le plus fier</h2><div class="favs">${favs.map(favCard).join("")}</div>` : ""}
    <h2 class="section" id="medias">Mes médias</h2>
    ${outletCards()}
    ${latest.length ? `<h2 class="section">Dernières publications</h2><div class="list">${latest.map(x=>artCard(x.o,x.c,x.a,x.i,true)).join("")}</div><p style="margin-top:22px"><a class="btn ghost" href="#/articles">Tous les articles →</a></p>`:""}
  </div>`;
}

/* ---------- page Articles : médias + recherche ---------- */
let sQ="", sGame="Tous", sMode="all", sSort="desc";
const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
function articlesPage(){
  const games = allGames(), arts = allArticles();
  const hasMode = arts.some(x=>x.a.mode==="interview");
  return `<div class="view">

function fillList(o,c){

}

/* ---------- routage ---------- */
function route(){
  const app = document.getElementById("app");
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(p[0]==="about"){ app.innerHTML=about(); setupAbout(); }
  else if(p[0]==="contact"){ app.innerHTML=contact(); }
  else if(p[0]==="articles"){ app.innerHTML=articlesPage(); bindSearch(); }
  else if(p[0]==="credits"){ app.innerHTML=creditsPage(); }
  else if(p[0]==="outlet" && p[1]){
    const o = DATA.outlets.find(x=>x.id===p[1]);
    if(!o){ app.innerHTML=home(); setupHome(); }
    else if(p[2]){
      const c = o.categories.find(x=>x.id===p[2]);
      if(!c) app.innerHTML=outletPage(o);
      else if(p[3]!==undefined && c.articles[+p[3]]) app.innerHTML=reader(o,c,c.articles[+p[3]]);
      else { app.innerHTML=catPage(o,c); bindCat(o,c); }
    } else app.innerHTML=outletPage(o);
  }
  else { app.innerHTML=home(); setupHome(); }
  if(p[0]!=="about" && p[0]) window.onscroll=null;
  chrome(); hydrateLikes();
}
window.addEventListener("hashchange", e=>{ if(location.hash==="#medias"||location.hash==="#stats") return; route(); });

/* ---------- animations ---------- */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function setupHome(){
  document.querySelectorAll(".stat b").forEach(el=>{
    const n = +el.dataset.n; if(reduce){ el.textContent=n; return; }
    const io = new IntersectionObserver(es=>{ if(es[0].isIntersecting){ io.disconnect(); const t0=performance.now(); (function tick(t){ const k=Math.min(1,(t-t0)/900); el.textContent=Math.round(n*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(tick); })(t0); } },{threshold:.6});
    io.observe(el);
  });
  const img = document.getElementById("heroImg");
  if(img && !reduce){ const f=()=>{ img.style.transform=`translateY(${Math.min(window.scrollY*.06,28)}px) scale(1.06)`; }; window.onscroll=f; f(); } else window.onscroll=null;
}
function setupAbout(){
  const steps = [...document.querySelectorAll(".step")], tl = document.getElementById("tl"), bar = document.getElementById("tlp");
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); }),{threshold:.25});
  steps.forEach(s=>io.observe(s));
  const f=()=>{ const r=tl.getBoundingClientRect(), h=window.innerHeight; const p=Math.max(0,Math.min(1,(h*.55-r.top)/r.height)); bar.style.height=(p*(r.height-12))+"px"; };
  window.onscroll=f; f();
}

        : `<div class="f"><label>Lien</label><input type="url" data-b="outlets.${oi}.categories.${ci}.articles.${ai}.url" value="${esc(a.url||"")}"></div>`}
        <div class="f"><label>Nature du travail</label><select data-b="outlets.${oi}.categories.${ci}.articles.${ai}.mode">
          <option value="" ${a.mode!=="interview"?"selected":""}>Standard</option>
          <option value="interview" ${a.mode==="interview"?"selected":""}>Interview de A à Z (mise en avant)</option></select></div>
        <div class="f"><label class="chk"><input type="checkbox" data-chk="outlets.${oi}.categories.${ci}.articles.${ai}.fav" data-rerender="1" ${a.fav?"checked":""}><span>★ Un de mes articles favoris (affiché sur l'accueil)</span></label></div>
        ${a.fav?`<div class="f"><label>Pourquoi celui-là ? (une phrase, optionnel)</label><input type="text" data-b="outlets.${oi}.categories.${ci}.articles.${ai}.favNote" value="${esc(a.favNote||"")}"></div>`:""}
        ${imgField("Image de couverture (optionnel)","outlets."+oi+".categories."+ci+".articles."+ai+".image",a.image,1200,"","outlets."+oi+".categories."+ci+".articles."+ai+".imageCredit")}
      </details>`).join("")}
    </div>`).join("")}
    <button class="b sec s" style="margin-top:12px" data-add="c.${oi}">+ Ajouter une rubrique</button>
  </div>`).join("");
  return h + `<button class="b sec" data-add="o">+ Ajouter un média</button>` + tSave();
}

function favRefs(){ const r=[]; DATA.outlets.forEach((o,oi)=>o.categories.forEach((c,ci)=>c.articles.forEach((a,ai)=>r.push({o,c,a,oi,ci,ai})))); return r; }
function tFav(){
  return `<div class="note">Coche les articles dont tu es le plus fier : ils apparaissent sur l'accueil, dans « Mes articles dont je suis le plus fier ». Idéal : 3 à 6. Tu peux en ajouter ou en retirer quand tu veux.</div>
  <div class="f" style="margin-top:14px"><input type="text" id="favQ" placeholder="Chercher un article (titre, jeu, média)…"></div>
  <div class="status" id="favCount" style="margin-bottom:12px"></div><div id="favList"></div>` + tSave();
}
function paintFav(){
  const q = norm((document.getElementById("favQ")||{}).value||"");
  const all = favRefs(), n = all.filter(x=>x.a.fav).length;
  document.getElementById("favCount").textContent = n+" favori"+(n>1?"s":"")+" sélectionné"+(n>1?"s":"");
  document.getElementById("favList").innerHTML = all.filter(x=>!q||norm(x.a.title+" "+(x.a.game||"")+" "+x.o.name).includes(q)).map(x=>`<div class="card" style="padding:12px 14px">
    <label class="chk"><input type="checkbox" data-fav="${x.oi}.${x.ci}.${x.ai}" ${x.a.fav?"checked":""}><span><b>${esc(x.a.title.trim()).slice(0,90)}</b><small>${esc(x.o.name)} · ${esc(x.c.label)}${x.a.game?" · "+esc(x.a.game):""}</small></span></label>
    ${x.a.fav?`<input type="text" style="margin-top:10px;width:100%" data-favnote="${x.oi}.${x.ci}.${x.ai}" placeholder="Pourquoi cet article ? (optionnel, une phrase)" value="${esc(x.a.favNote||"")}">`:""}
  </div>`).join("") || `<div class="note">Aucun article trouvé.</div>`;
}
function bindFav(){
  paintFav();
  const ref = s => { const [oi,ci,ai]=s.split(".").map(Number); return DATA.outlets[oi].categories[ci].articles[ai]; };
  document.getElementById("favQ").addEventListener("input",paintFav);
  const list = document.getElementById("favList");
  list.addEventListener("change",e=>{ if(e.target.dataset.fav){ ref(e.target.dataset.fav).fav = e.target.checked; paintFav(); } });
  list.addEventListener("input",e=>{ if(e.target.dataset.favnote) ref(e.target.dataset.favnote).favNote = e.target.value; });
}

function tStats(){
  if(!likeOn()) return `<div class="note">Les boutons « J'aime » sont désactivés (Réglages).</div>`;
  return `<div class="note">Nombre de « J'aime » par article. Le chargement prend une trentaine de secondes (le compteur gratuit limite le débit) : clique pour actualiser.</div>
  <div class="savebar" style="position:static;border:none;padding:12px 0"><button class="b" id="lkRefresh">Charger / actualiser</button><span class="status" id="lkStatus"></span></div><div id="lkList"></div>`;
}
function paintStats(){
  const rows = allArticles().map(x=>({x,k:akey(x.a),n:(lkCache[akey(x.a)]||{}).n})).sort((p,q)=>(q.n||0)-(p.n||0));
  const tot = rows.reduce((s,r)=>s+(r.n||0),0);
  const l=document.getElementById("lkList"); if(!l) return;
  l.innerHTML = `<div class="lkrow"><strong>Total</strong><b>${tot} ♥</b></div>` + rows.map(r=>`<div class="lkrow"><span>${esc((r.x.a.title||"").trim()).slice(0,80)}<br><small class="note">${esc(r.x.o.name)}${r.x.a.game?" · "+esc(r.x.a.game):""}</small></span><b>${r.n==null?"—":r.n+" ♥"}</b></div>`).join("");
}
function bindStats(){
  if(!likeOn()) return; paintStats();
  document.getElementById("lkRefresh").addEventListener("click",async()=>{
    const b=document.getElementById("lkRefresh"), st=document.getElementById("lkStatus"), all=allArticles(); b.disabled=true;
    let i=0; for(const x of all){ i++; st.textContent=`Chargement ${i}/${all.length}…`; await lkLoad(akey(x.a),true); paintStats(); }
    st.textContent="À jour."; b.disabled=false;
  });
}

/* ---------- images / fichiers ---------- */
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function shrink(file, max){
  const url = await readAsDataURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  let w=img.width,h=img.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
  const png = file.type==="image/png" && max<=500;
  const out = cv.toDataURL(png?"image/png":"image/jpeg",.84);
  return { dataUrl:out, ext: png?"png":"jpg" };
}
const slug = s => s.toLowerCase().replace(/\.[^.]+$/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30) || "fichier";

function bindEdit(){
  const eb = document.getElementById("eb");
  eb.querySelectorAll("[data-b]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{
    let v = el.value; if(el.dataset.bool) v = (v==="true");
    setPath(DATA,el.dataset.b,v);
    if(el.dataset.b==="theme.accent") applyTheme();
    if(el.dataset.rerender) paintTab();
  }));
  eb.querySelectorAll("[data-bt]").forEach(el=>el.addEventListener("input",()=>setPath(DATA,el.dataset.bt,textToHtml(el.value))));

  eb.querySelectorAll("[data-img]").forEach(el=>el.addEventListener("change",async()=>{
    const f=el.files[0]; if(!f) return;
    try{
      const {dataUrl,ext} = await shrink(f, +el.dataset.dim||1200);
      const path = `assets/uploads/${Date.now()}-${slug(f.name)}.${ext}`;
      pending[path] = { b64:dataUrl.split(",")[1], preview:dataUrl };
      setPath(DATA,el.dataset.img,path); if(el.dataset.cred) setPath(DATA,el.dataset.cred,""); paintTab(); chrome();
    }catch(e){ alert("Image illisible."); }
  }));
  eb.querySelectorAll("[data-clr]").forEach(el=>el.addEventListener("click",()=>{ setPath(DATA,el.dataset.clr,""); if(el.dataset.cred) setPath(DATA,el.dataset.cred,""); paintTab(); chrome(); }));
  eb.querySelectorAll("[data-chk]").forEach(el=>el.addEventListener("change",()=>{ setPath(DATA,el.dataset.chk,el.checked); if(el.dataset.rerender) paintTab(); }));

  eb.querySelectorAll("[data-vid]").forEach(el=>el.addEventListener("change",async()=>{
    const f=el.files[0]; if(!f) return;
    if(f.size>20*1024*1024){ alert("Vidéo trop lourde (20 Mo maximum). Compresse-la ou utilise un lien externe."); el.value=""; return; }
    const dataUrl = await readAsDataURL(f);
    const path = `assets/uploads/${Date.now()}-${slug(f.name)}.${f.name.split(".").pop().toLowerCase()}`;
    pending[path] = { b64:dataUrl.split(",")[1], preview:URL.createObjectURL(f) };
    setPath(DATA,el.dataset.vid,path); paintTab();
  }));

  eb.querySelectorAll("[data-txt]").forEach(el=>el.addEventListener("change",async()=>{
    const f=el.files[0]; if(!f) return;
    try{
      let html;
      if(/\.docx$/i.test(f.name)){ if(!window.mammoth) throw new Error("Lecture .docx indisponible hors-ligne."); html=(await window.mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value; }
      else html=textToHtml(await f.text());
      setPath(DATA,el.dataset.txt,html); paintTab();
    }catch(e){ alert("Fichier illisible : "+e.message); }
  }));

  eb.querySelectorAll("[data-rm]").forEach(el=>el.addEventListener("click",()=>{
    const [t,...n]=el.dataset.rm.split("."); const i=n.map(Number);
    if(!confirm("Supprimer cet élément ?")) return;
    if(t==="o") DATA.outlets.splice(i[0],1);
    if(t==="c") DATA.outlets[i[0]].categories.splice(i[1],1);
    if(t==="a") DATA.outlets[i[0]].categories[i[1]].articles.splice(i[2],1);
    if(t==="p") DATA.about.splice(i[0],1);
    paintTab();
  }));
  eb.querySelectorAll("[data-add]").forEach(el=>el.addEventListener("click",()=>{
    const [t,...n]=el.dataset.add.split("."); const i=n.map(Number);
    const today = new Date().toISOString().slice(0,10);
    if(t==="o") DATA.outlets.push({id:"media-"+uid(),name:"Nouveau média",role:"Rédacteur",logo:"",cover:"",description:"",filterable:true,categories:[]});
    if(t==="c") DATA.outlets[i[0]].categories.push({id:"cat-"+uid(),label:"Nouvelle rubrique",color:"teal",articles:[]});
    if(t==="a"){ newTarget=i[0]+"."+i[1]; }
    if(t==="a") DATA.outlets[i[0]].categories[i[1]].articles.unshift({title:"Nouvel article",date:today,game:"",event:"",type:"lien",url:"",image:"",imageCredit:"",mode:"",fav:false,favNote:""});
    if(t==="p") DATA.about.push({title:"Nouveau volet",text:"",image:""});
    if(t==="a"){ const na=DATA.outlets[i[0]].categories[i[1]].articles[0]; openSet.add(na); }
    paintTab();
    if(t==="a"){ const n=document.getElementById("newArt"); newTarget=null; if(n){ n.classList.add("flash"); n.scrollIntoView({block:"start"}); const t0=n.querySelector('input[type=text]'); if(t0){ t0.focus({preventScroll:true}); t0.select(); } } }
  }));
  eb.querySelectorAll("details[data-art]").forEach(d=>d.addEventListener("toggle",()=>{ const [oi,ci,ai]=d.dataset.art.split(".").map(Number); const ar=DATA.outlets[oi].categories[ci].articles[ai]; if(ar){ d.open?openSet.add(ar):openSet.delete(ar); } }));
  eb.querySelectorAll("[data-mv]").forEach(el=>el.addEventListener("click",()=>{
    const [i,d]=el.dataset.mv.split(",").map(Number); const a=DATA.about; [a[i],a[i+d]]=[a[i+d],a[i]]; paintTab();
  }));

  const sb=document.getElementById("saveBtn");
  if(sb) sb.addEventListener("click",save);
}

/* ---------- publication sur GitHub ---------- */
async function ghPut(path, b64, msg){
  const g=DATA.github, api=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`;
  const H={Authorization:`Bearer ${ghToken}`,Accept:"application/vnd.github+json"};
  let sha; const r=await fetch(api+`?ref=${g.branch||"main"}`,{headers:H}); if(r.ok) sha=(await r.json()).sha;
  const p=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify({message:msg,content:b64,sha,branch:g.branch||"main"})});
  if(!p.ok){ const t=await p.text(); throw new Error(p.status+" "+t.slice(0,160)); }
}
function missingCredits(){
  const m=[], A=DATA.author;
  if(A.photo && !A.photoCredit) m.push("Photo de profil");
  DATA.outlets.forEach(o=>{
    if(o.cover && !o.coverCredit) m.push("Bannière « "+o.name+" »");
    o.categories.forEach(c=>c.articles.forEach(a=>{ if(a.image && !a.imageCredit) m.push((a.title||"Article").trim().slice(0,60)); }));
  });
  DATA.about.forEach(p=>{ if(p.image && !p.imageCredit) m.push("À propos : "+p.title); });
  if(DATA.contact.image && !DATA.contact.imageCredit) m.push("Page Contact");
  return m;
}
async function save(){
  if(saving) return;
  const st=document.getElementById("status"), g=DATA.github||{};
  if(!g.owner||!g.repo){ st.textContent="Renseigne le compte et le dépôt GitHub dans « Réglages »."; return; }
  const miss = missingCredits();
  if(miss.length && !confirm("Crédit photo manquant pour :\n\n• "+miss.slice(0,8).join("\n• ")+(miss.length>8?"\n• … et "+(miss.length-8)+" autre(s)":"")+"\n\nPour éviter tout souci de droit d'auteur, mieux vaut les renseigner.\nEnregistrer quand même ?")){ st.textContent="Enregistrement annulé : complète les crédits photo."; return; }
  if(!ghToken){ ghToken=prompt("Jeton d'accès GitHub (Contents : Read and write) :"); if(!ghToken){ st.textContent="Enregistrement annulé."; return; } }
  saving=true; st.textContent="Envoi en cours…";
  try{
    const paths=Object.keys(pending);
    for(let i=0;i<paths.length;i++){ st.textContent=`Envoi des fichiers ${i+1}/${paths.length}…`; await ghPut(paths[i],pending[paths[i]].b64,"Ajout d'un fichier depuis l'espace édition"); }
    st.textContent="Envoi des textes…";
    const clean=JSON.parse(JSON.stringify(DATA));
    await ghPut(g.path||"data.json", btoa(unescape(encodeURIComponent(JSON.stringify(clean,null,2)))), "Mise à jour du portfolio");
    paths.forEach(p=>delete pending[p]);
    st.textContent="Enregistré. En ligne dans environ une à deux minutes.";
  }catch(e){ ghToken=null; st.textContent="Échec : "+e.message; }
  saving=false;
}
